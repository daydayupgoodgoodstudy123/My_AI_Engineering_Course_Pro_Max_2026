<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { fill: #c0392b; }
      .tail { fill: #e8a598; }
      .dead { fill: none; stroke: #c0392b; stroke-width: 0.8; stroke-dasharray: 2 2; }
      .axis { stroke: #444; stroke-width: 1; fill: none; }
      .rep { stroke: #c0392b; stroke-width: 2; fill: none; }
      .acc { stroke: #2e7d32; stroke-width: 2; fill: none; }
      .mix { stroke: #2c5ea9; stroke-width: 2; fill: none; stroke-dasharray: 5 3; }
      .thresh { stroke: #aaa; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">Model collapse — finite resampling eats the tail first, then the variance</text>

  <rect x="30" y="48" width="270" height="400" class="hot"/>
  <text x="165" y="70" text-anchor="middle" class="label">replace: sample n, refit, repeat</text>
  <text x="165" y="86" text-anchor="middle" class="small">Zipf truth, V=200, n=2000, seed 11</text>

  <text x="48" y="108" class="small">gen 0    tail alive 85/100   H 5.46</text>
  <line x1="48" y1="158" x2="282" y2="158" class="axis"/>
  <rect x="50" y="116" width="10" height="42" class="head"/>
  <rect x="62" y="130" width="8" height="28" class="head"/>
  <rect x="72" y="140" width="7" height="18" class="head"/>
  <rect x="81" y="148" width="6" height="10" class="head"/>
  <rect x="90" y="151" width="182" height="7" class="tail"/>

  <text x="48" y="188" class="small">gen 4    tail alive 43/100   H 5.07</text>
  <line x1="48" y1="238" x2="282" y2="238" class="axis"/>
  <rect x="50" y="192" width="10" height="46" class="head"/>
  <rect x="62" y="208" width="8" height="30" class="head"/>
  <rect x="72" y="219" width="7" height="19" class="head"/>
  <rect x="81" y="227" width="6" height="11" class="head"/>
  <rect x="90" y="231" width="94" height="7" class="tail"/>
  <rect x="186" y="231" width="86" height="7" class="dead"/>

  <text x="48" y="268" class="small">gen 20   tail alive 12/100   H 4.66</text>
  <line x1="48" y1="318" x2="282" y2="318" class="axis"/>
  <rect x="50" y="266" width="10" height="52" class="head"/>
  <rect x="62" y="284" width="8" height="34" class="head"/>
  <rect x="72" y="296" width="7" height="22" class="head"/>
  <rect x="81" y="306" width="6" height="12" class="head"/>
  <rect x="90" y="311" width="26" height="7" class="tail"/>
  <rect x="118" y="311" width="154" height="7" class="dead"/>

  <rect x="48" y="338" width="234" height="98" class="box"/>
  <text x="165" y="356" text-anchor="middle" class="content">P[category p gets 0 draws]</text>
  <text x="165" y="372" text-anchor="middle" class="content">= (1 - p)^n ≈ e^(-np)</text>
  <text x="165" y="390" text-anchor="middle" class="small">rarest p=0.00063, np=1.25: 0.286</text>
  <text x="165" y="404" text-anchor="middle" class="small">simulated 0.240 (48/200 trials)</text>
  <text x="165" y="424" text-anchor="middle" class="small">zero draws is absorbing: gone for good</text>

  <rect x="312" y="48" width="256" height="400" class="cool"/>
  <text x="440" y="70" text-anchor="middle" class="label">re-anchor to real data</text>
  <text x="440" y="86" text-anchor="middle" class="small">same gen-0 model, generation 20</text>

  <rect x="328" y="100" width="224" height="76" class="box"/>
  <text x="440" y="118" text-anchor="middle" class="content">accumulate (Gerstgrasser 2024)</text>
  <text x="338" y="136" class="small">pool = real gen 0 + every synthetic gen</text>
  <text x="338" y="150" class="small">extinct 16 -> 16    TV 0.090 -> 0.108</text>
  <text x="338" y="164" class="small">H lost 2.8%    tail alive 85/100</text>

  <rect x="328" y="188" width="224" height="76" class="box"/>
  <text x="440" y="206" text-anchor="middle" class="content">mix: rho real per gen (Seddik 2024)</text>
  <text x="338" y="224" class="small">rho=0.20: extinct 35-45, TV ≈ 0.13</text>
  <text x="338" y="238" class="small">fresh real draws resurrect categories</text>
  <text x="338" y="252" class="small">a maximal synthetic fraction exists</text>

  <rect x="328" y="276" width="224" height="76" class="box"/>
  <text x="440" y="294" text-anchor="middle" class="content">filter / verify (Lesson 05)</text>
  <text x="338" y="312" class="small">guards quality, not diversity</text>
  <text x="338" y="326" class="small">pair with diversity objectives:</text>
  <text x="338" y="340" class="small">QD archives, Red Queen (Lesson 10)</text>

  <rect x="328" y="364" width="224" height="72" class="box"/>
  <text x="440" y="382" text-anchor="middle" class="content">policy (skill output)</text>
  <text x="338" y="400" class="small">provenance tags, synthetic-fraction cap,</text>
  <text x="338" y="414" class="small">entropy/extinct dashboard, regenerate</text>
  <text x="338" y="428" class="small">from source - never from the last gen</text>

  <rect x="580" y="48" width="270" height="400" class="cold"/>
  <text x="715" y="70" text-anchor="middle" class="label">monitor: expected distinct in k draws</text>
  <text x="715" y="86" text-anchor="middle" class="content">sum_i 1 - (1 - p_i)^k   (pass@k)</text>

  <line x1="620" y1="110" x2="620" y2="300" class="axis"/>
  <line x1="620" y1="300" x2="830" y2="300" class="axis"/>
  <text x="596" y="118" class="small">44</text>
  <text x="596" y="178" class="small">40</text>
  <text x="596" y="238" class="small">36</text>
  <text x="596" y="298" class="small">32</text>
  <text x="620" y="316" class="small">0</text>
  <text x="720" y="316" class="small">10</text>
  <text x="822" y="316" class="small">20</text>
  <text x="725" y="330" text-anchor="middle" class="small">generation (k=100, truth 44.0)</text>

  <line x1="620" y1="114" x2="830" y2="114" class="thresh"/>
  <polyline class="acc" points="620,140 662,142 704,143 746,144 788,145 830,147"/>
  <polyline class="mix" points="620,140 662,152 704,150 746,148 788,145 830,146"/>
  <polyline class="rep" points="620,140 641,155 662,172 683,190 704,205 725,222 746,238 767,250 788,262 809,270 830,276"/>
  <text x="758" y="138" class="small">accumulate 42.2</text>
  <text x="700" y="166" class="small">mix 42.3</text>
  <text x="770" y="292" class="small">replace 33.2</text>

  <rect x="596" y="346" width="238" height="90" class="box"/>
  <text x="715" y="364" text-anchor="middle" class="content">late collapse (Gaussian, n=25)</text>
  <text x="606" y="382" class="small">variance is a martingale: E[var]=1</text>
  <text x="606" y="396" class="small">yet median sd 1.00 -> 0.59 by gen 20</text>
  <text x="606" y="410" class="small">36% of chains already below sd 0.5</text>
  <text x="606" y="424" class="small">preserved in expectation ≠ preserved</text>

  <text x="440" y="476" text-anchor="middle" class="caption">Each probability is a martingale, so tail mass is conserved in expectation; a category with zero draws is gone for good, so entropy, tail-alive and distinct@k fall.</text>
  <text x="440" y="498" text-anchor="middle" class="small">Shumailov et al., Nature 631:755-759 (2024) · Gerstgrasser et al. arXiv:2404.01413 · Seddik et al. arXiv:2404.05090</text>
</svg>
