<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .arrow { stroke: #444; stroke-width: 1.2; fill: none; marker-end: url(#head); }
      .thresh { stroke: #aaa; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
      .axis { stroke: #444; stroke-width: 1; fill: none; }
      .tm { stroke: #2c5ea9; stroke-width: 2; fill: none; }
      .dtt { stroke: #2e7d32; stroke-width: 2; fill: none; }
    </style>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#444"/>
    </marker>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">Oversight without a bottleneck: T scores every edit, humans audit a sample</text>

  <!-- Panel 1: per-edit tiers -->
  <rect x="24" y="48" width="290" height="400" class="box"/>
  <text x="169" y="70" text-anchor="middle" class="label">1 · every edit: monitor score → tier</text>
  <text x="40" y="92" class="small">U proposes k edits per cycle</text>
  <text x="40" y="106" class="small">T (frozen, outside the loop) scores each</text>

  <rect x="40" y="122" width="258" height="56" class="hot"/>
  <text x="48" y="140" class="content">AUDIT  top b% (benign exceed τ w.p. b)</text>
  <text x="48" y="156" class="small">named human reads it before merge</text>
  <text x="48" y="170" class="small">harmful → caught, run stops safely</text>

  <rect x="40" y="188" width="258" height="56" class="cold"/>
  <text x="48" y="206" class="content">DEFER  suspicious band</text>
  <text x="48" y="222" class="small">replaced by T's conservative edit</text>
  <text x="48" y="236" class="small">(or batched for review at cycle end)</text>

  <rect x="40" y="254" width="258" height="56" class="cool"/>
  <text x="48" y="272" class="content">AUTO-COMMIT  below the band</text>
  <text x="48" y="288" class="small">invariants hold (Lesson 17)</text>
  <text x="48" y="302" class="small">logged to out-of-loop archive (Lesson 18)</text>

  <text x="40" y="334" class="small">U cannot see τ, scores, or which edits</text>
  <text x="40" y="348" class="small">were audited → no safe channel to buy.</text>
  <text x="40" y="372" class="small">default run, AUC 0.8, 5% audit:</text>
  <text x="40" y="386" class="content">no oversight    3.3%  safety</text>
  <text x="40" y="400" class="content">trusted monitor 36.0% / 100% useful</text>
  <text x="40" y="414" class="content">+ defer (20%)   53.3% /  89.6%</text>
  <text x="40" y="428" class="content">adaptive attacker: 36.0% → 5.3%</text>

  <!-- Panel 2: cycle boundary -->
  <rect x="330" y="48" width="230" height="400" class="box"/>
  <text x="445" y="70" text-anchor="middle" class="label">2 · cycle boundary: pause rule</text>
  <rect x="346" y="88" width="198" height="40" class="box"/>
  <text x="445" y="106" text-anchor="middle" class="content">cycle n staged</text>
  <text x="445" y="120" text-anchor="middle" class="small">gain G_n, suspicious count s_n</text>
  <path class="arrow" d="M445,128 L445,150"/>
  <rect x="346" y="150" width="198" height="78" class="hot"/>
  <text x="354" y="168" class="content">pause if any:</text>
  <text x="354" y="184" class="small">G_n &gt; 1.3 × G_{n-1}   (jump)</text>
  <text x="354" y="198" class="small">s_n &gt; N              (burst)</text>
  <text x="354" y="212" class="small">regression · gap · evaluator touched</text>
  <path class="arrow" d="M400,228 L370,262"/>
  <path class="arrow" d="M490,228 L520,262"/>
  <rect x="346" y="262" width="88" height="54" class="hot"/>
  <text x="390" y="282" text-anchor="middle" class="small">human audits</text>
  <text x="390" y="296" text-anchor="middle" class="small">whole cycle</text>
  <text x="390" y="310" text-anchor="middle" class="small">signs resume</text>
  <rect x="456" y="262" width="88" height="54" class="cool"/>
  <text x="500" y="282" text-anchor="middle" class="small">merge →</text>
  <text x="500" y="296" text-anchor="middle" class="small">S_{n+1}</text>
  <text x="500" y="310" text-anchor="middle" class="small">next cycle</text>
  <text x="346" y="344" class="small">default run: 1.95 false pauses,</text>
  <text x="346" y="358" class="small">22.6 audits/run vs 7.9 (2.9x labour)</text>
  <text x="346" y="372" class="small">safety 36.0% → 53.3%</text>
  <text x="346" y="394" class="small">adaptive attacker, seed 3:</text>
  <text x="346" y="408" class="small">monitor alone 4.7%, + pause 28.3%</text>
  <text x="346" y="422" class="small">two signals beat one good one</text>

  <!-- Panel 3: frontier -->
  <rect x="576" y="48" width="280" height="400" class="box"/>
  <text x="716" y="70" text-anchor="middle" class="label">3 · what the budget buys (AUC 0.8)</text>
  <line x1="610" y1="100" x2="610" y2="360" class="axis"/>
  <line x1="610" y1="360" x2="840" y2="360" class="axis"/>
  <text x="586" y="104" class="small">100%</text>
  <text x="590" y="234" class="small">50%</text>
  <text x="596" y="364" class="small">0%</text>
  <text x="560" y="230" class="small" transform="rotate(-90 560 230)">safety</text>
  <text x="610" y="378" class="small">0</text>
  <text x="640" y="378" class="small">5</text>
  <text x="667" y="378" class="small">10</text>
  <text x="705" y="378" class="small">20</text>
  <text x="760" y="378" class="small">50</text>
  <text x="820" y="378" class="small">100</text>
  <text x="725" y="392" text-anchor="middle" class="small">audit budget % (benign edits audited)</text>
  <line x1="610" y1="126" x2="840" y2="126" class="thresh"/>
  <text x="760" y="122" class="small">90% target</text>
  <!-- TM: 3.3,17.3,25.7,36.0,50.0,64.7,89.3,100 at budgets 0,1,2,5,10,20,50,100 -->
  <polyline class="tm" points="610,351 612,315 615,293 622,266 633,230 656,192 725,128 840,100"/>
  <!-- DTT: 28.0,41.7,46.7,53.3,60.3,64.7,89.3,100 -->
  <polyline class="dtt" points="610,287 612,252 615,239 622,221 633,203 656,192 725,128 840,100"/>
  <text x="640" y="150" class="small" fill="#2e7d32">defer-to-trusted (usefulness 86–100%)</text>
  <text x="640" y="164" class="small" fill="#2c5ea9">trusted monitoring (usefulness 100%)</text>
  <text x="592" y="412" class="small">90% safety needs a 100% budget at AUC 0.8,</text>
  <text x="592" y="426" class="small">20% at AUC 0.95: the monitor is the lever.</text>

  <text x="440" y="476" text-anchor="middle" class="caption">Greenblatt et al. (arXiv:2312.06942) recast for a loop: edits compound, so safety is "no harmful edit committed over the run".</text>
  <text x="440" y="498" text-anchor="middle" class="small">Hassabis (Davos, Jan 2026): the full closing of the loop is an unknown — the protocol decides what the human sees, when, and whether U can predict it.</text>
</svg>
