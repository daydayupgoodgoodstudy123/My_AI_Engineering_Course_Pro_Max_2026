<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .honest { stroke: #2e7d32; stroke-width: 2; fill: none; }
      .sandbag { stroke: #c0392b; stroke-width: 2; fill: none; stroke-dasharray: 6 3; }
      .axis { stroke: #444; stroke-width: 1; fill: none; }
      .thresh { stroke: #aaa; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">Sandbagging screens inside the improvement loop</text>

  <!-- Panel 1: noise injection -->
  <rect x="40" y="50" width="380" height="380" class="box"/>
  <text x="230" y="72" text-anchor="middle" class="label">noise injection: accuracy vs weight-noise sigma</text>
  <line x1="80" y1="100" x2="80" y2="390" class="axis"/>
  <line x1="80" y1="390" x2="400" y2="390" class="axis"/>
  <text x="48" y="137" class="small">0.80</text>
  <text x="48" y="207" class="small">0.65</text>
  <text x="48" y="300" class="small">0.45</text>
  <text x="48" y="393" class="small">0.25</text>
  <text x="76" y="406" class="small">0</text>
  <text x="140" y="406" class="small">0.04</text>
  <text x="204" y="406" class="small">0.08</text>
  <text x="268" y="406" class="small">0.12</text>
  <text x="332" y="406" class="small">0.16</text>
  <text x="392" y="406" class="small">0.20</text>
  <text x="240" y="422" text-anchor="middle" class="small">sigma (Gaussian noise added to weights)</text>
  <!-- unnoised sandbag score, reference line -->
  <line x1="80" y1="203" x2="400" y2="203" class="thresh"/>
  <text x="300" y="215" class="small">sandbagger at sigma=0 (0.65)</text>
  <!-- honest: 0.80 .79 .762 .719 .664 .603 .54 .48 .426 .38 .343 -->
  <polyline class="honest" points="80,133 112,138 144,151 176,171 208,197 240,225 272,255 304,283 336,308 368,329 400,347"/>
  <text x="96" y="124" class="small" fill="#2e7d32">honest: only falls</text>
  <!-- sandbag: .65 .70 .743 .717 .664 then joins honest -->
  <polyline class="sandbag" points="80,203 112,180 144,160 176,172 208,197 240,225 272,255 304,283 336,308 368,329 400,347"/>
  <rect x="128" y="146" width="34" height="24" class="hot" fill-opacity="0.35"/>
  <text x="170" y="150" class="small" fill="#c0392b">+9 pts rise at sigma=0.04</text>
  <text x="170" y="162" class="small" fill="#c0392b">suppressor breaks before capability</text>
  <text x="96" y="248" class="small">rule: max over sigma of acc(sigma) - acc(0) &gt;= tau -> FLAG</text>
  <text x="96" y="262" class="small">seed 11, n=400: 15-pt sandbag flagged 97.0%,</text>
  <text x="96" y="276" class="small">honest 1.5% false positives, 3-pt sandbag 14.5%</text>

  <!-- Panel 2: where the loop touches the measurement -->
  <rect x="440" y="50" width="400" height="190" class="box"/>
  <text x="640" y="72" text-anchor="middle" class="label">where a self-improver touches its own measurement</text>
  <rect x="456" y="86" width="118" height="60" class="cold"/>
  <text x="515" y="106" text-anchor="middle" class="content">candidate is</text>
  <text x="515" y="120" text-anchor="middle" class="content">the thing measured</text>
  <text x="515" y="136" text-anchor="middle" class="small">may underperform</text>
  <rect x="582" y="86" width="118" height="60" class="hot"/>
  <text x="641" y="106" text-anchor="middle" class="content">improver edits</text>
  <text x="641" y="120" text-anchor="middle" class="content">the eval surface</text>
  <text x="641" y="136" text-anchor="middle" class="small">Lesson 14 Goodhart</text>
  <rect x="708" y="86" width="118" height="60" class="cool"/>
  <text x="767" y="106" text-anchor="middle" class="content">scores gate</text>
  <text x="767" y="120" text-anchor="middle" class="content">the next cycle</text>
  <text x="767" y="136" text-anchor="middle" class="small">Lesson 21 thresholds</text>
  <text x="640" y="170" text-anchor="middle" class="content">halt what crosses, promote what does not =</text>
  <text x="640" y="186" text-anchor="middle" class="content">selection for scores just under the line, intent optional</text>
  <text x="640" y="208" text-anchor="middle" class="small">PF v2 (Apr 15, 2025): Sandbagging is a Research Category; response =</text>
  <text x="640" y="222" text-anchor="middle" class="small">"elicitation approach that overcomes sandbagging, or a conservative upper bound"</text>

  <!-- Panel 3: screens and verdicts -->
  <rect x="440" y="256" width="400" height="174" class="box"/>
  <text x="640" y="278" text-anchor="middle" class="label">screen battery for every candidate near a threshold</text>
  <rect x="456" y="292" width="184" height="56" class="cold"/>
  <text x="548" y="310" text-anchor="middle" class="content">noise injection (weights)</text>
  <text x="548" y="326" text-anchor="middle" class="small">pre-registered sigma grid + tau</text>
  <text x="548" y="340" text-anchor="middle" class="small">Tice et al., NeurIPS 2025</text>
  <rect x="648" y="292" width="176" height="56" class="cold"/>
  <text x="736" y="310" text-anchor="middle" class="content">paraphrase / format</text>
  <text x="736" y="326" text-anchor="middle" class="small">consistency of capability</text>
  <text x="736" y="340" text-anchor="middle" class="small">black-box, cheap</text>
  <rect x="456" y="356" width="184" height="56" class="cool"/>
  <text x="548" y="374" text-anchor="middle" class="content">fine-tuning elicitation</text>
  <text x="548" y="390" text-anchor="middle" class="small">few demos unlock password locks</text>
  <text x="548" y="404" text-anchor="middle" class="small">Greenblatt et al. 2024</text>
  <rect x="648" y="356" width="176" height="56" class="hot"/>
  <text x="736" y="374" text-anchor="middle" class="content">believed-unobserved split</text>
  <text x="736" y="390" text-anchor="middle" class="small">Phase 18 - 09 method; ethics</text>
  <text x="736" y="404" text-anchor="middle" class="small">and leakage limits apply</text>

  <text x="440" y="462" text-anchor="middle" class="caption">Anomalous improvement under noise is a halting event, not a data point: halt, audit, log to the risk report.</text>
  <text x="440" y="486" text-anchor="middle" class="small">measured = a * sandbagged + (1 - a) * true; the bias is a * gap (a = evaluation-awareness rate).</text>
</svg>
