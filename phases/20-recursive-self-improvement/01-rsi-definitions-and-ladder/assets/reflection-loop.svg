<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .arrow { stroke: #1a1a1a; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
      .loop { stroke: #c0392b; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; marker-end: url(#ah); }
      .axis { stroke: #444; stroke-width: 1; fill: none; }
      .thresh { stroke: #aaa; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
      .c-cold { stroke: #2c5ea9; stroke-width: 2; fill: none; }
      .c-cool { stroke: #2e7d32; stroke-width: 2; fill: none; }
      .c-hot { stroke: #c0392b; stroke-width: 2; fill: none; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">Three loop shapes — only the third is recursive</text>

  <!-- Panel (a): fixed improver -->
  <rect x="30" y="46" width="266" height="400" class="box"/>
  <text x="163" y="68" text-anchor="middle" class="label">(a) fixed improver · self-refinement</text>
  <rect x="55" y="88" width="100" height="40" class="cold"/>
  <text x="105" y="106" text-anchor="middle" class="content">improver f</text>
  <text x="105" y="120" text-anchor="middle" class="small">never changes</text>
  <rect x="175" y="88" width="100" height="40" class="box"/>
  <text x="225" y="106" text-anchor="middle" class="content">target S_n</text>
  <text x="225" y="120" text-anchor="middle" class="small">draft, answer</text>
  <line x1="155" y1="108" x2="173" y2="108" class="arrow"/>
  <path d="M225,128 C225,160 105,160 105,130" class="arrow"/>
  <text x="163" y="175" text-anchor="middle" class="content">S_{n+1} = f(S_n)</text>
  <text x="163" y="190" text-anchor="middle" class="small">converges to S* = f(S*)</text>
  <line x1="60" y1="400" x2="60" y2="215" class="axis"/>
  <line x1="60" y1="400" x2="280" y2="400" class="axis"/>
  <line x1="60" y1="250" x2="280" y2="250" class="thresh"/>
  <text x="200" y="246" class="small">ceiling 2.5x</text>
  <polyline class="c-cold" points="60,370 82,340 104,316 126,297 148,282 170,270 192,262 214,257 236,254 258,252 280,251"/>
  <text x="170" y="414" text-anchor="middle" class="small">cycle →   L3 when closed</text>
  <text x="163" y="434" text-anchor="middle" class="small">gain shrinks: target meets ceiling</text>

  <!-- Panel (b): diminishing returns -->
  <rect x="307" y="46" width="266" height="400" class="box"/>
  <text x="440" y="68" text-anchor="middle" class="label">(b) diminishing returns · self-training</text>
  <rect x="332" y="88" width="100" height="40" class="cold"/>
  <text x="382" y="106" text-anchor="middle" class="content">recipe</text>
  <text x="382" y="120" text-anchor="middle" class="small">generate·filter·tune</text>
  <rect x="452" y="88" width="100" height="40" class="box"/>
  <text x="502" y="106" text-anchor="middle" class="content">weights θ_n</text>
  <text x="502" y="120" text-anchor="middle" class="small">open target</text>
  <line x1="432" y1="108" x2="450" y2="108" class="arrow"/>
  <path d="M502,128 C502,160 382,160 382,130" class="arrow"/>
  <text x="440" y="175" text-anchor="middle" class="content">g_n = g_0 / (1+n)^β</text>
  <text x="440" y="190" text-anchor="middle" class="small">no ceiling, but gain only falls</text>
  <line x1="337" y1="400" x2="337" y2="215" class="axis"/>
  <line x1="337" y1="400" x2="557" y2="400" class="axis"/>
  <polyline class="c-cool" points="337,370 359,343 381,330 403,321 425,314 447,308 469,303 491,299 513,295 535,292 557,289"/>
  <text x="447" y="414" text-anchor="middle" class="small">cycle →   L3 when closed</text>
  <text x="440" y="434" text-anchor="middle" class="small">easy wins first; β is not editable</text>

  <!-- Panel (c): self-referential -->
  <rect x="584" y="46" width="266" height="400" class="hot"/>
  <text x="717" y="68" text-anchor="middle" class="label">(c) self-referential · RSI</text>
  <rect x="609" y="88" width="100" height="40" class="hot"/>
  <text x="659" y="106" text-anchor="middle" class="content">improver_n</text>
  <text x="659" y="120" text-anchor="middle" class="small">gain g_n</text>
  <rect x="729" y="88" width="100" height="40" class="hot"/>
  <text x="779" y="106" text-anchor="middle" class="content">improver_{n+1}</text>
  <text x="779" y="120" text-anchor="middle" class="small">gain r·g_n</text>
  <line x1="709" y1="108" x2="727" y2="108" class="arrow"/>
  <path d="M779,128 C779,160 659,160 659,130" class="loop"/>
  <text x="717" y="175" text-anchor="middle" class="content">g_{n+1} = r · g_n</text>
  <text x="717" y="190" text-anchor="middle" class="small">the edit target is the improver</text>
  <line x1="614" y1="400" x2="614" y2="215" class="axis"/>
  <line x1="614" y1="400" x2="834" y2="400" class="axis"/>
  <line x1="614" y1="250" x2="834" y2="250" class="thresh"/>
  <polyline class="c-cold" points="614,370 636,340 658,316 680,297 702,282 724,270 746,262 768,257 790,254 812,252 834,251"/>
  <text x="836" y="254" class="small" text-anchor="end">r&lt;1</text>
  <polyline class="c-hot" points="614,370 636,352 658,331 680,306 702,276 724,250 746,222 768,195 790,170 812,148 834,130"/>
  <text x="800" y="128" class="small" text-anchor="end">r&gt;1</text>
  <text x="724" y="414" text-anchor="middle" class="small">cycle →   L4 bounded · L5 open domain</text>
  <text x="717" y="434" text-anchor="middle" class="small">a bad edit is inherited by every later cycle</text>

  <text x="440" y="474" text-anchor="middle" class="caption">Same curve, different loop: (a) and (c) with r &lt; 1 are identical trajectories — only the edit log says which one you have.</text>
  <text x="440" y="496" text-anchor="middle" class="small">Rungs (Liu et al. 2026): L3 = (a)/(b) closed without a human · L4 = (c) on fixed benchmarks · L5 = (c) transferring across open domains.</text>
</svg>
