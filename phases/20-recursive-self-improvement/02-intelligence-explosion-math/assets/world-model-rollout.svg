<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .sub { stroke: #2e7d32; stroke-width: 2; fill: none; }
      .knife { stroke: #2c5ea9; stroke-width: 2; fill: none; }
      .super { stroke: #c0392b; stroke-width: 2.2; fill: none; }
      .ideal { stroke: #c0392b; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
      .axis { stroke: #444; stroke-width: 1; fill: none; }
      .thresh { stroke: #aaa; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
      .mark { fill: #c0392b; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">Takeoff math — r sets the shape, R_AI sets the threshold, the ceiling sets the end</text>

  <!-- Left panel: progress rate across cycles (toy, default run, r = 1.2 with a 10-OOM ceiling) -->
  <rect x="40" y="50" width="520" height="380" class="box"/>
  <text x="300" y="72" text-anchor="middle" class="label">progress rate (years of 2024 progress per year) across development cycles</text>

  <line x1="80" y1="110" x2="80" y2="390" class="axis"/>
  <line x1="80" y1="390" x2="540" y2="390" class="axis"/>
  <text x="62" y="394" class="small">0</text>
  <text x="62" y="338" class="small">1</text>
  <text x="62" y="282" class="small">2</text>
  <text x="62" y="226" class="small">3</text>
  <text x="62" y="170" class="small">4</text>
  <text x="62" y="114" class="small">5</text>
  <text x="77" y="408" class="small">0</text>
  <text x="190" y="408" class="small">5</text>
  <text x="302" y="408" class="small">10</text>
  <text x="417" y="408" class="small">15</text>
  <text x="530" y="408" class="small">20</text>
  <text x="300" y="422" text-anchor="middle" class="small">cycle (3 months each; 1 year = 4 cycles)</text>

  <!-- 3 years-in-1 threshold -->
  <line x1="80" y1="222" x2="540" y2="222" class="thresh"/>
  <text x="84" y="218" class="small">3 years-in-1</text>

  <!-- r = 0.8: subcritical, decelerates -->
  <polyline class="sub" points="80,334 126,348 195,358 310,369 425,374 540,377"/>
  <text x="440" y="368" class="small">r = 0.8  (r·a &lt; 1: fizzles)</text>

  <!-- r = 1.0: knife edge, only the ceiling bends it -->
  <polyline class="knife" points="80,334 195,340 310,345 425,351 540,355"/>
  <text x="440" y="346" class="small">r = 1.0  (knife edge)</text>

  <!-- r = 1.2 with a 10-OOM ceiling: accelerates, peaks at cycle 15, dies at the ceiling -->
  <polyline class="super" points="80,334 126,330 172,320 218,306 264,287 310,259 356,217 402,162 425,142 448,158 471,250 494,372 540,390"/>
  <circle cx="425" cy="142" r="3.5" class="mark"/>
  <text x="300" y="150" class="small">r = 1.2, 10-OOM ceiling</text>
  <text x="300" y="163" class="small">rate doubles c9, 3-in-1 c14, peak c15</text>
  <text x="462" y="300" class="small">ceiling reached c16</text>
  <text x="462" y="313" class="small">R_AI falls below 1 at c15</text>

  <!-- same r = 1.2 without a ceiling: finite-time blow-up -->
  <polyline class="ideal" points="80,334 126,328 172,313 218,288 264,240 310,120 318,110"/>
  <text x="128" y="246" class="small">no ceiling: same r,</text>
  <text x="128" y="259" class="small">finite-time blow-up</text>

  <!-- Right panel: the three numbers -->
  <rect x="580" y="50" width="260" height="380" class="box"/>
  <text x="710" y="72" text-anchor="middle" class="label">three numbers govern the curve</text>

  <rect x="600" y="88" width="220" height="78" class="hot"/>
  <text x="710" y="106" text-anchor="middle" class="content">r = returns to software R&amp;D</text>
  <text x="610" y="124" class="small">1 doubling of cumulative research</text>
  <text x="610" y="138" class="small">buys r doublings of S</text>
  <text x="610" y="154" class="small">Forethought 2025: median 1.2 (0.4–3.6)</text>

  <rect x="600" y="176" width="220" height="78" class="cold"/>
  <text x="710" y="194" text-anchor="middle" class="content">R_AI = feedback gain / difficulty</text>
  <text x="610" y="212" class="small">&gt; 1 compounds across cycles</text>
  <text x="610" y="226" class="small">&lt; 1 each cycle's gain fades</text>
  <text x="610" y="242" class="small">Burtsev 2026: structural, not a level</text>

  <rect x="600" y="264" width="220" height="78" class="cool"/>
  <text x="710" y="282" text-anchor="middle" class="content">ceiling = OOMs of headroom</text>
  <text x="610" y="300" class="small">damps progress as it nears</text>
  <text x="610" y="314" class="small">D&amp;H: 6–16 OOMs (≈ 6–16 years)</text>
  <text x="610" y="330" class="small">10-in-1 needs &gt; 10 OOMs of room</text>

  <rect x="600" y="352" width="220" height="64" class="box"/>
  <text x="710" y="370" text-anchor="middle" class="content">amplification before acceleration</text>
  <text x="610" y="388" class="small">toy, b = 1: R_AI ≥ 1 at c3 while the</text>
  <text x="610" y="402" class="small">rate is 0.72× its start; doubling c13</text>

  <text x="440" y="470" text-anchor="middle" class="caption">Davidson &amp; Houlden (Forethought, Aug 2025): ~60% that &gt;3 years of progress compress into 1 year; ~20% for &gt;10 years.</text>
  <text x="440" y="494" text-anchor="middle" class="small">Burtsev (arXiv:2609.00137): self-amplification can start before acceleration is visible; the cycle length is the clock.</text>
</svg>
