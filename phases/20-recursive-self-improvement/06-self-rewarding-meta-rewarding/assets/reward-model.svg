<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .flow { stroke: #444; stroke-width: 1.3; fill: none; }
      .drift { stroke: #c0392b; stroke-width: 1.3; fill: none; stroke-dasharray: 4 3; }
      .anchor { stroke: #2c5ea9; stroke-width: 1.6; fill: none; }
      .warn { fill: #c0392b; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">Self-rewarding loops — the judge is the student; only an outside anchor stops the drift</text>

  <!-- Panel 1: Self-Rewarding -->
  <rect x="24" y="46" width="268" height="392" class="box"/>
  <text x="158" y="68" text-anchor="middle" class="label">1 · Self-Rewarding (Yuan et al. 2024)</text>
  <rect x="48" y="84" width="220" height="44" class="box"/>
  <text x="158" y="102" text-anchor="middle" class="content">actor M_t</text>
  <text x="158" y="118" text-anchor="middle" class="small">N = 4 candidates per prompt</text>
  <line x1="158" y1="128" x2="158" y2="152" class="flow"/>
  <rect x="48" y="152" width="220" height="56" class="hot"/>
  <text x="158" y="170" text-anchor="middle" class="content">judge = SAME weights</text>
  <text x="158" y="186" text-anchor="middle" class="small">0–5 additive rubric, 3 samples</text>
  <text x="158" y="200" text-anchor="middle" class="small">score = q + β·length + noise</text>
  <line x1="158" y1="208" x2="158" y2="232" class="flow"/>
  <rect x="48" y="232" width="220" height="44" class="box"/>
  <text x="158" y="250" text-anchor="middle" class="content">best vs worst → pair</text>
  <text x="158" y="266" text-anchor="middle" class="small">ties discarded</text>
  <line x1="158" y1="276" x2="158" y2="300" class="flow"/>
  <rect x="48" y="300" width="220" height="44" class="cool"/>
  <text x="158" y="318" text-anchor="middle" class="content">DPO → M_t+1</text>
  <text x="158" y="334" text-anchor="middle" class="small">acts AND judges next round</text>
  <polyline class="flow" points="48,322 34,322 34,106 48,106"/>
  <polyline class="drift" points="268,180 282,180 282,254 268,254"/>
  <text x="48" y="368" class="small">paper-reported, Llama 2 70B, 3 iterations:</text>
  <text x="48" y="384" class="small">AlpacaEval 2.0  9.94 → 15.38 → 20.44%</text>
  <text x="48" y="400" class="small">mean length  1,092 → 1,552 → 2,552 chars</text>
  <text x="48" y="416" class="small">judge acc.  65.1 → 81.7% (incidental)</text>

  <!-- Panel 2: Meta-Rewarding -->
  <rect x="306" y="46" width="268" height="392" class="box"/>
  <text x="440" y="68" text-anchor="middle" class="label">2 · Meta-Rewarding (Wu et al. 2024)</text>
  <rect x="330" y="84" width="220" height="40" class="box"/>
  <text x="440" y="102" text-anchor="middle" class="content">actor → 4 candidates</text>
  <text x="440" y="116" text-anchor="middle" class="small">Llama-3-8B-Instruct seed</text>
  <line x1="440" y1="124" x2="440" y2="148" class="flow"/>
  <rect x="330" y="148" width="220" height="40" class="hot"/>
  <text x="440" y="166" text-anchor="middle" class="content">judge: 11 judgements each</text>
  <text x="440" y="180" text-anchor="middle" class="small">pick response with highest variance</text>
  <line x1="440" y1="188" x2="440" y2="212" class="flow"/>
  <rect x="330" y="212" width="220" height="52" class="cold"/>
  <text x="440" y="230" text-anchor="middle" class="content">meta-judge: pairwise, both orders</text>
  <text x="440" y="244" text-anchor="middle" class="small">Elo over judgements → judge pairs</text>
  <text x="440" y="258" text-anchor="middle" class="small">same weights, new prompt</text>
  <line x1="440" y1="264" x2="440" y2="288" class="flow"/>
  <rect x="330" y="288" width="104" height="44" class="box"/>
  <text x="382" y="306" text-anchor="middle" class="small">length control ρ</text>
  <text x="382" y="322" text-anchor="middle" class="small">hand-written</text>
  <rect x="446" y="288" width="104" height="44" class="cool"/>
  <text x="498" y="306" text-anchor="middle" class="small">DPO on actor +</text>
  <text x="498" y="322" text-anchor="middle" class="small">judge pairs (it. 1–2)</text>
  <text x="330" y="360" class="small">LC AlpacaEval 2  22.92 → 39.44%</text>
  <text x="330" y="376" class="small">SR + length ctrl   22.92 → 35.49%</text>
  <text x="330" y="392" class="small warn">mean judge score  4.1 → 4.7+ (saturates)</text>
  <text x="330" y="408" class="small warn">human Spearman  0.315 → 0.326 (flat)</text>
  <text x="330" y="424" class="small warn">meta-judge picks higher score: 97.68%</text>

  <!-- Panel 3: monitoring + anchor -->
  <rect x="588" y="46" width="268" height="392" class="box"/>
  <text x="722" y="68" text-anchor="middle" class="label">3 · log every iteration</text>
  <rect x="608" y="84" width="228" height="40" class="cold"/>
  <text x="722" y="101" text-anchor="middle" class="content">judge–human agreement</text>
  <text x="722" y="116" text-anchor="middle" class="small">on a FIXED audit set</text>
  <rect x="608" y="132" width="228" height="40" class="box"/>
  <text x="722" y="149" text-anchor="middle" class="content">length drift</text>
  <text x="722" y="164" text-anchor="middle" class="small">mean and p90 of samples</text>
  <rect x="608" y="180" width="228" height="40" class="box"/>
  <text x="722" y="197" text-anchor="middle" class="content">score inflation</text>
  <text x="722" y="212" text-anchor="middle" class="small">judge mean − human mean</text>
  <rect x="608" y="228" width="228" height="40" class="box"/>
  <text x="722" y="245" text-anchor="middle" class="content">preference-pair entropy</text>
  <text x="722" y="260" text-anchor="middle" class="small">which style wins; tie share</text>
  <rect x="608" y="290" width="228" height="62" class="cold"/>
  <text x="722" y="310" text-anchor="middle" class="content">grounded anchor</text>
  <text x="722" y="326" text-anchor="middle" class="small">human labels the loop never trains on;</text>
  <text x="722" y="340" text-anchor="middle" class="small">regress (judge − human) on length → β̂</text>
  <polyline class="anchor" points="608,320 580,320 580,170 550,170"/>
  <text x="608" y="380" class="small">code/main.py, seed 7, β = 0.5:</text>
  <text x="608" y="396" class="small">frozen  true q 0.627 → 0.542, len ×2</text>
  <text x="608" y="412" class="small">meta    true q 0.627 → 0.771, β → 0</text>
  <text x="608" y="428" class="small">agreement on own pairs is NOT a monitor</text>

  <text x="440" y="472" text-anchor="middle" class="caption">Something outside the loop has to be grounded: an extra judging layer helps only if it knows what the judge does not.</text>
  <text x="440" y="496" text-anchor="middle" class="small">Phase 20 · Lesson 06 — Goodhart with proxy and optimizer in the same weights; Lesson 14 builds the audit harness.</text>
</svg>
