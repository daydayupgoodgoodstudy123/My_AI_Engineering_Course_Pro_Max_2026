<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .boundary { stroke: #c0392b; stroke-width: 2; stroke-dasharray: 7 4; fill: none; }
      .arrow { stroke: #c0392b; stroke-width: 1.5; fill: none; marker-end: url(#head); }
      .check { stroke: #2c5ea9; stroke-width: 1.5; fill: none; marker-end: url(#headb); }
    </style>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/>
    </marker>
    <marker id="headb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2c5ea9"/>
    </marker>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">Trajectory integrity: the agent's story vs records it cannot write</text>

  <!-- Left: agent-writable zone -->
  <rect x="30" y="50" width="330" height="300" class="hot"/>
  <text x="195" y="72" text-anchor="middle" class="label">agent-writable zone (what rules read)</text>
  <rect x="48" y="86" width="294" height="52" class="box"/>
  <text x="58" y="104" class="content">steps.jsonl — its own log</text>
  <text x="58" y="120" class="small">tool, path, claimed output, claimed dur</text>
  <rect x="48" y="146" width="294" height="52" class="box"/>
  <text x="58" y="164" class="content">src/  tests/  config/  run.sh  eval/</text>
  <text x="58" y="180" class="small">anything the shell can touch — incl. the detector</text>
  <rect x="48" y="206" width="294" height="52" class="box"/>
  <text x="58" y="224" class="content">final claim: "tests passed"</text>
  <text x="58" y="240" class="small">DGM 2025: plain-text 'tool output', no tool call</text>
  <rect x="48" y="266" width="294" height="70" class="box"/>
  <text x="58" y="284" class="content">case files (2024-2026)</text>
  <text x="58" y="300" class="small">AI Scientist: timeout edit, self-call loop</text>
  <text x="58" y="314" class="small">CUDA Engineer: memory-reuse past the check</text>
  <text x="58" y="328" class="small">METR: timer patched, evaluator stubbed</text>

  <!-- Boundary -->
  <line x1="400" y1="50" x2="400" y2="350" class="boundary"/>
  <text x="400" y="368" text-anchor="middle" class="small">write boundary</text>
  <text x="400" y="382" text-anchor="middle" class="small">(DSEwiki 2026: assumed read-only, GET wrote)</text>

  <!-- Right: harness-owned zone -->
  <rect x="440" y="50" width="410" height="300" class="cold"/>
  <text x="645" y="72" text-anchor="middle" class="label">harness-owned zone (what structure compares)</text>
  <rect x="458" y="86" width="374" height="52" class="box"/>
  <text x="468" y="104" class="content">receipts.jsonl — hash-chained tool calls</text>
  <text x="468" y="120" class="small">measured dur, egress sockets, child procs</text>
  <rect x="458" y="146" width="374" height="52" class="box"/>
  <text x="468" y="164" class="content">frozen evaluator snapshot</text>
  <text x="468" y="180" class="small">tests/ eval/ limits copied BEFORE the run; re-run after</text>
  <rect x="458" y="206" width="374" height="52" class="box"/>
  <text x="468" y="224" class="content">harness_result: pass | fail | timeout</text>
  <text x="468" y="240" class="small">the only "pass" that counts</text>
  <rect x="458" y="266" width="374" height="70" class="cool"/>
  <text x="468" y="284" class="content">structural checks (no path strings)</text>
  <text x="468" y="300" class="small">S1 claim vs frozen result   S2 log vs receipt chain</text>
  <text x="468" y="314" class="small">S3 sandbox egress           S4 process budget</text>
  <text x="468" y="328" class="small">blind spot: special-casing the tests -> held-out set</text>

  <!-- Arrows across the boundary -->
  <path d="M342,112 L458,112" class="check"/>
  <path d="M342,232 L458,232" class="check"/>
  <path d="M342,172 C390,172 410,250 458,172" class="arrow"/>
  <text x="372" y="160" class="small" fill="#c0392b">edit</text>

  <!-- Bottom: outcome strip -->
  <rect x="30" y="400" width="820" height="62" class="box"/>
  <text x="440" y="420" text-anchor="middle" class="label">simulated: 400 runs, 30% tampered, seed 11</text>
  <text x="48" y="440" class="small">rules vs static tampering: recall 100.0%, precision 57.3% (65 honest test edits flagged)</text>
  <text x="48" y="454" class="small">rules vs adaptive adversary: recall 0.0%   |   structural audit: recall 100.0%, precision 100.0% in both</text>

  <text x="440" y="486" text-anchor="middle" class="caption">Static rules describe surface forms the agent can rewrite; structural checks compare its story with records it cannot touch.</text>
  <text x="440" y="506" text-anchor="middle" class="small">Phase 20 · Lesson 15 — Reward Hacking Case Files</text>
</svg>
