<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .axis { stroke: #444; stroke-width: 1; fill: none; }
      .fit { stroke: #2c5ea9; stroke-width: 2; fill: none; }
      .alt { stroke: #c0392b; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
      .alt2 { stroke: #2e7d32; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
      .ceiling { stroke: #c0392b; stroke-width: 1.5; fill: none; stroke-dasharray: 3 3; }
      .guide { stroke: #999; stroke-width: 1; fill: none; stroke-dasharray: 2 3; }
      .shade { fill: #c0392b; fill-opacity: 0.07; }
      .ok { fill: #2e7d32; }
      .fail { fill: #c0392b; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">Time horizon = where a fitted curve crosses 50% — the ceiling decides how much is extrapolation</text>

  <!-- Left panel: success vs log task time -->
  <rect x="30" y="46" width="540" height="400" class="box"/>
  <text x="300" y="66" text-anchor="middle" class="label">agent success vs human task length (log scale), 228 tasks</text>

  <line x1="80" y1="90" x2="80" y2="380" class="axis"/>
  <line x1="80" y1="380" x2="540" y2="380" class="axis"/>
  <text x="50" y="94" class="small">100%</text>
  <text x="56" y="167" class="small">80%</text>
  <text x="56" y="239" class="small">50%</text>
  <text x="62" y="384" class="small">0%</text>
  <text x="74" y="398" class="small">1m</text>
  <text x="138" y="398" class="small">4m</text>
  <text x="200" y="398" class="small">15m</text>
  <text x="270" y="398" class="small">1h</text>
  <text x="334" y="398" class="small">4h</text>
  <text x="402" y="398" class="small">8h</text>
  <text x="458" y="398" class="small">16h</text>
  <text x="518" y="398" class="small">32h</text>
  <text x="310" y="414" text-anchor="middle" class="small">human completion time (log axis)</text>

  <!-- unobserved region beyond the 8 h ceiling -->
  <rect x="412" y="90" width="128" height="290" class="shade"/>
  <line x1="412" y1="90" x2="412" y2="380" class="ceiling"/>
  <text x="416" y="102" class="small" fill="#c0392b">suite ceiling 8 h</text>
  <text x="416" y="114" class="small" fill="#c0392b">no tasks observed -></text>

  <!-- guide lines for 80% and 50% -->
  <line x1="80" y1="163" x2="540" y2="163" class="guide"/>
  <line x1="80" y1="235" x2="540" y2="235" class="guide"/>

  <!-- binned success rates (dots) -->
  <circle cx="100" cy="96" r="3.5" class="ok"/>
  <circle cx="140" cy="101" r="3.5" class="ok"/>
  <circle cx="180" cy="108" r="3.5" class="ok"/>
  <circle cx="220" cy="120" r="3.5" class="ok"/>
  <circle cx="260" cy="138" r="3.5" class="ok"/>
  <circle cx="300" cy="160" r="3.5" class="ok"/>
  <circle cx="340" cy="186" r="3.5" class="ok"/>
  <circle cx="380" cy="210" r="3.5" class="ok"/>
  <circle cx="440" cy="248" r="3.5" class="fail"/>
  <circle cx="480" cy="282" r="3.5" class="fail"/>
  <circle cx="520" cy="322" r="3.5" class="fail"/>

  <!-- true/full-suite fit (blue solid) crossing 50% near 16 h -->
  <path class="fit" d="M80,93 C200,100 280,135 340,180 S430,250 470,280 S520,335 540,352"/>
  <!-- steep alternative fitted on truncated data (red dashed): crosses 50% near 9 h -->
  <path class="alt" d="M80,92 C230,96 320,140 380,195 S430,290 452,340 S470,372 480,378"/>
  <!-- shallow alternative (green dashed): crosses 50% far beyond the suite -->
  <path class="alt2" d="M80,100 C220,118 320,160 412,210 S500,250 540,268"/>

  <!-- markers -->
  <line x1="470" y1="235" x2="470" y2="380" class="guide"/>
  <text x="446" y="372" class="small" fill="#2c5ea9">h50 ~16 h</text>
  <line x1="300" y1="163" x2="300" y2="380" class="guide"/>
  <text x="286" y="372" class="small" fill="#2c5ea9">h80 ~1.6 h</text>

  <text x="92" y="432" class="small" fill="#2c5ea9">solid: fit on full suite</text>
  <text x="250" y="432" class="small" fill="#c0392b">dashed red: steep fit, truncated at 8 h</text>
  <text x="92" y="444" class="small" fill="#2e7d32">dashed green: shallow fit, same points -> h50 far off-suite</text>

  <!-- Right column -->
  <rect x="590" y="46" width="260" height="400" class="box"/>
  <text x="720" y="66" text-anchor="middle" class="label">what moves the number</text>

  <rect x="606" y="80" width="228" height="78" class="hot"/>
  <text x="720" y="98" text-anchor="middle" class="content">truncation</text>
  <text x="720" y="114" text-anchor="middle" class="small">bounded estimators pin to</text>
  <text x="720" y="127" text-anchor="middle" class="small">the ceiling: 16 h reads 7.2 h</text>
  <text x="720" y="140" text-anchor="middle" class="small">logistic CI x3.1 -> x9.5</text>
  <text x="720" y="152" text-anchor="middle" class="small">METR: unreliable above ~16 h</text>

  <rect x="606" y="168" width="228" height="78" class="cold"/>
  <text x="720" y="186" text-anchor="middle" class="content">noisy human times</text>
  <text x="720" y="202" text-anchor="middle" class="small">80% of baselines within ~3x</text>
  <text x="720" y="215" text-anchor="middle" class="small">slope attenuates 0.6 -> 0.53</text>
  <text x="720" y="228" text-anchor="middle" class="small">h50 inflated; METR SIMEX:</text>
  <text x="720" y="240" text-anchor="middle" class="small">correction ~ -30% on 50% TH</text>

  <rect x="606" y="256" width="228" height="78" class="cool"/>
  <text x="720" y="274" text-anchor="middle" class="content">fit choice</text>
  <text x="720" y="290" text-anchor="middle" class="small">free vs fixed slope, Cauchy,</text>
  <text x="720" y="303" text-anchor="middle" class="small">Weibull, isotonic ...</text>
  <text x="720" y="316" text-anchor="middle" class="small">Mar 2026 note: 50% TH up to</text>
  <text x="720" y="328" text-anchor="middle" class="small">-35%, 80% TH up to +100%</text>

  <rect x="606" y="344" width="228" height="90" class="box"/>
  <text x="720" y="362" text-anchor="middle" class="content">a report must disclose</text>
  <text x="614" y="380" class="small">- suite length distribution, ceiling</text>
  <text x="614" y="393" class="small">- measured vs estimated baselines</text>
  <text x="614" y="406" class="small">- fit form, slope, regularisation</text>
  <text x="614" y="419" class="small">- 50%/80% CIs + sensitivity table</text>
  <text x="614" y="430" class="small">- saturated scores excluded</text>

  <text x="440" y="472" text-anchor="middle" class="caption">Three curves agree where tasks exist and disagree where they do not; the horizon lives in the shaded region.</text>
  <text x="440" y="494" text-anchor="middle" class="small">TH 1.1 (Jan 2026): 228 tasks, 31 of 8 h+, 5 with measured baselines; CIs often x2 each way (METR, Mar 20, 2026).</text>
</svg>
