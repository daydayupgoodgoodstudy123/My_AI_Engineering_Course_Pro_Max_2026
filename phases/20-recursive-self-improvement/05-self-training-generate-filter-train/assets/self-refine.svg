<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .arrow { stroke: #1a1a1a; stroke-width: 1.5; fill: none; marker-end: url(#head); }
      .axis { stroke: #444; stroke-width: 1; fill: none; }
      .oracle { stroke: #2e7d32; stroke-width: 2; fill: none; }
      .noisy { stroke: #2c5ea9; stroke-width: 2; fill: none; stroke-dasharray: 5 3; }
      .selfc { stroke: #c0392b; stroke-width: 2; fill: none; }
    </style>
    <marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">Generate → filter → train: the policy converges to what the filter accepts</text>

  <!-- Panel 1: the loop as a reweighting operator -->
  <rect x="30" y="48" width="280" height="392" class="box"/>
  <text x="170" y="70" text-anchor="middle" class="label">one iteration = multiply by a_s</text>

  <rect x="60" y="92" width="220" height="56" class="cold"/>
  <text x="170" y="112" text-anchor="middle" class="content">GENERATE  s ~ π(s)</text>
  <text x="170" y="130" text-anchor="middle" class="small">A: method, valid 90%  B: shortcut, 40%</text>

  <path d="M170,148 L170,176" class="arrow"/>

  <rect x="60" y="180" width="220" height="56" class="hot"/>
  <text x="170" y="200" text-anchor="middle" class="content">FILTER  keep w.p. a_s</text>
  <text x="170" y="218" text-anchor="middle" class="small">oracle: a_s = c_s   noisy: q+(TPR−q)c_s</text>

  <path d="M170,236 L170,264" class="arrow"/>

  <rect x="60" y="268" width="220" height="56" class="cool"/>
  <text x="170" y="288" text-anchor="middle" class="content">TRAIN  π'(s) ∝ π(s)·a_s</text>
  <text x="170" y="306" text-anchor="middle" class="small">SFT on kept set = refit to its mix</text>

  <path d="M60,296 L44,296 L44,120 L60,120" class="arrow"/>
  <text x="48" y="212" text-anchor="middle" class="small" transform="rotate(-90 48 212)">repeat</text>

  <rect x="60" y="344" width="220" height="80" class="box"/>
  <text x="170" y="364" text-anchor="middle" class="content">z' = z + log(a_B / a_A)</text>
  <text x="170" y="382" text-anchor="middle" class="small">shortcut grows  ⇔  a_B &gt; a_A</text>
  <text x="170" y="398" text-anchor="middle" class="small">symmetric leak: only if q &gt; TPR</text>
  <text x="170" y="414" text-anchor="middle" class="small">biased leak: if b &gt; b* = 0.50</text>

  <!-- Panel 2: verification hierarchy -->
  <rect x="326" y="48" width="260" height="392" class="box"/>
  <text x="456" y="70" text-anchor="middle" class="label">verification hierarchy (Chen et al. 2026)</text>

  <rect x="346" y="88" width="220" height="64" class="cool"/>
  <text x="456" y="106" text-anchor="middle" class="content">1  formal verifier</text>
  <text x="456" y="122" text-anchor="middle" class="small">AlphaProof / Lean · a_s = c_s</text>
  <text x="456" y="138" text-anchor="middle" class="small">loop = search; converges</text>

  <rect x="346" y="160" width="220" height="64" class="cold"/>
  <text x="456" y="178" text-anchor="middle" class="content">2  execution / answer match</text>
  <text x="456" y="194" text-anchor="middle" class="small">STaR, ReST-EM, unit tests</text>
  <text x="456" y="210" text-anchor="middle" class="small">leaks off-coverage; saturates</text>

  <rect x="346" y="232" width="220" height="64" class="box"/>
  <text x="456" y="250" text-anchor="middle" class="content">3  judge / reward model</text>
  <text x="456" y="266" text-anchor="middle" class="small">LLM-as-judge, RM in Llama 2/3</text>
  <text x="456" y="282" text-anchor="middle" class="small">optimizes the judge's biases</text>

  <rect x="346" y="304" width="220" height="64" class="hot"/>
  <text x="456" y="322" text-anchor="middle" class="content">4  self-assessment</text>
  <text x="456" y="338" text-anchor="middle" class="small">accept if own confidence &gt; τ</text>
  <text x="456" y="354" text-anchor="middle" class="small">converges to the loudest mode</text>

  <text x="456" y="392" text-anchor="middle" class="small">strength of demonstrated gains</text>
  <text x="456" y="408" text-anchor="middle" class="small">follows this order (1,250 papers)</text>
  <path d="M580,96 L580,360" class="arrow"/>
  <text x="574" y="230" text-anchor="middle" class="small" transform="rotate(90 574 230)">weaker filter</text>

  <!-- Panel 3: simulated shortcut share -->
  <rect x="602" y="48" width="248" height="392" class="box"/>
  <text x="726" y="70" text-anchor="middle" class="label">shortcut share, 8 iterations</text>

  <line x1="640" y1="90" x2="640" y2="400" class="axis"/>
  <line x1="640" y1="400" x2="836" y2="400" class="axis"/>
  <text x="634" y="94" text-anchor="end" class="small">100%</text>
  <text x="634" y="249" text-anchor="end" class="small">50%</text>
  <text x="634" y="403" text-anchor="end" class="small">0%</text>
  <text x="650" y="416" class="small">0</text>
  <text x="734" y="416" class="small">4</text>
  <text x="822" y="416" class="small">8</text>
  <text x="738" y="432" text-anchor="middle" class="small">iteration</text>

  <polyline class="selfc" points="650,245 672,196 694,155 716,127 738,110 760,99 782,97 804,95 826,93"/>
  <polyline class="noisy" points="650,245 672,273 694,298 716,326 738,350 760,367 782,381 804,389 826,393"/>
  <polyline class="oracle" points="650,245 672,302 694,346 716,370 738,389 760,396 782,398 804,399 826,399"/>

  <text x="660" y="130" class="small" fill="#c0392b">self-assessment: 99% (acc 36%)</text>
  <text x="700" y="296" class="small" fill="#2c5ea9">noisy FP .3: 2% (acc 89%)</text>
  <text x="700" y="375" class="small" fill="#2e7d32">oracle: 0.3% (acc 89%)</text>

  <text x="440" y="468" text-anchor="middle" class="caption">The filter is the model: a_B / a_A, not correctness, sets the fixed point. Oracle 0.46×, noisy 0.68×, self-assessment 1.99× per iteration.</text>
  <text x="440" y="492" text-anchor="middle" class="small">python3 code/main.py — seed 20, 2,000 samples per iteration; audit the filter's precision every round.</text>
</svg>
