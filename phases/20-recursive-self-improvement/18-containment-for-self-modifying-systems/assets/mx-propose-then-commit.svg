<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .arrow { stroke: #444; stroke-width: 1.5; fill: none; marker-end: url(#head); }
      .deny { stroke: #c0392b; stroke-width: 1.5; fill: none; marker-end: url(#head); }
      .wall { stroke: #1a1a1a; stroke-width: 3; stroke-dasharray: 8 5; fill: none; }
    </style>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#444"/>
    </marker>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">Containment for self-edits: propose inside, decide outside, record forever</text>

  <!-- Panel 1: inside the sandbox -->
  <rect x="30" y="50" width="250" height="400" class="box"/>
  <text x="155" y="72" text-anchor="middle" class="label">inside the sandbox (identity: loop)</text>
  <rect x="50" y="90" width="210" height="60" class="cool"/>
  <text x="155" y="112" text-anchor="middle" class="content">scaffold/  (writable)</text>
  <text x="155" y="130" text-anchor="middle" class="small">the only legitimate edit surface</text>
  <rect x="50" y="162" width="210" height="60" class="cold"/>
  <text x="155" y="184" text-anchor="middle" class="content">eval/  tests/  (read-only mount)</text>
  <text x="155" y="202" text-anchor="middle" class="small">separate process, separate identity</text>
  <rect x="50" y="234" width="210" height="60" class="hot"/>
  <text x="155" y="256" text-anchor="middle" class="content">egress: default deny</text>
  <text x="155" y="274" text-anchor="middle" class="small">allowlist via logging proxy</text>
  <rect x="50" y="306" width="210" height="60" class="hot"/>
  <text x="155" y="328" text-anchor="middle" class="content">caps: time / tokens / CPU</text>
  <text x="155" y="346" text-anchor="middle" class="small">held by the orchestrator, not a file</text>
  <text x="155" y="400" text-anchor="middle" class="small">the loop may propose anything, move nothing</text>

  <line x1="300" y1="50" x2="300" y2="450" class="wall"/>
  <text x="300" y="468" text-anchor="middle" class="small">sandbox boundary</text>

  <path d="M280,120 L330,120" class="arrow"/>
  <text x="305" y="108" text-anchor="middle" class="small">proposal</text>

  <!-- Panel 2: gatekeeper -->
  <rect x="330" y="50" width="250" height="400" class="box"/>
  <text x="455" y="72" text-anchor="middle" class="label">gatekeeper (identity: committer)</text>
  <text x="455" y="106" text-anchor="middle" class="small">categories derived from paths, not declared</text>
  <rect x="345" y="118" width="220" height="30" class="hot"/>
  <text x="455" y="138" text-anchor="middle" class="content">1 metadata-mismatch  -&gt; deny</text>
  <rect x="345" y="154" width="220" height="30" class="hot"/>
  <text x="455" y="174" text-anchor="middle" class="content">2 evaluator / tests  -&gt; deny</text>
  <rect x="345" y="190" width="220" height="30" class="box"/>
  <text x="455" y="210" text-anchor="middle" class="content">3 network/deps/config -&gt; escalate</text>
  <rect x="345" y="226" width="220" height="30" class="box"/>
  <text x="455" y="246" text-anchor="middle" class="content">4 large-diff &gt;200    -&gt; escalate</text>
  <rect x="345" y="262" width="220" height="30" class="hot"/>
  <text x="455" y="282" text-anchor="middle" class="content">5 cycle / budget cap -&gt; deny</text>
  <rect x="345" y="298" width="220" height="30" class="cool"/>
  <text x="455" y="318" text-anchor="middle" class="content">6 small code edit    -&gt; allow</text>
  <text x="455" y="352" text-anchor="middle" class="small">ordered; first match wins; rule recorded</text>
  <rect x="345" y="378" width="220" height="56" class="cold"/>
  <text x="455" y="398" text-anchor="middle" class="content">escalate -&gt; human queue</text>
  <text x="455" y="416" text-anchor="middle" class="small">budgeted trusted labour (Lesson 19)</text>

  <path d="M580,313 L630,313" class="arrow"/>
  <text x="605" y="302" text-anchor="middle" class="small">allow</text>
  <path d="M580,133 L630,133" class="deny"/>
  <text x="605" y="122" text-anchor="middle" class="small">deny</text>

  <!-- Panel 3: archive -->
  <rect x="630" y="50" width="220" height="400" class="box"/>
  <text x="740" y="72" text-anchor="middle" class="label">archive (append-only)</text>
  <rect x="650" y="90" width="180" height="34" class="cold"/>
  <text x="740" y="104" text-anchor="middle" class="content">r0 prev=GENESIS</text>
  <text x="740" y="118" text-anchor="middle" class="small">hash(body) = h0</text>
  <path d="M740,124 L740,138" class="arrow"/>
  <rect x="650" y="140" width="180" height="34" class="cold"/>
  <text x="740" y="154" text-anchor="middle" class="content">r1 prev=h0  deny</text>
  <text x="740" y="168" text-anchor="middle" class="small">hash(body) = h1</text>
  <path d="M740,174 L740,188" class="arrow"/>
  <rect x="650" y="190" width="180" height="34" class="cold"/>
  <text x="740" y="204" text-anchor="middle" class="content">r2 prev=h1  allow</text>
  <text x="740" y="218" text-anchor="middle" class="small">state_hash = S2</text>
  <path d="M740,224 L740,238" class="arrow"/>
  <rect x="650" y="240" width="180" height="34" class="cool"/>
  <text x="740" y="254" text-anchor="middle" class="content">r3 prev=h2  rollback-&gt;r1</text>
  <text x="740" y="268" text-anchor="middle" class="small">appended, not rewritten</text>
  <path d="M740,274 L740,288" class="arrow"/>
  <rect x="650" y="290" width="180" height="34" class="hot"/>
  <text x="740" y="304" text-anchor="middle" class="content">published head = h3</text>
  <text x="740" y="318" text-anchor="middle" class="small">copy held outside the sandbox</text>
  <text x="740" y="350" text-anchor="middle" class="small">alter r_k naively  -&gt; FAIL at k</text>
  <text x="740" y="366" text-anchor="middle" class="small">alter + re-hash     -&gt; FAIL at k+1</text>
  <text x="740" y="382" text-anchor="middle" class="small">alter LAST + re-hash -&gt; only the</text>
  <text x="740" y="398" text-anchor="middle" class="small">published head catches it</text>

  <text x="440" y="492" text-anchor="middle" class="caption">Every boundary lives outside the loop's edit surface; path rules cannot see semantics, so monitoring (Lesson 19) sits beside this layer.</text>
</svg>
