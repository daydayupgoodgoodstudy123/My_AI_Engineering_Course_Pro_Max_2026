<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .sw-curve { stroke: #c0392b; stroke-width: 2; fill: none; }
      .both-curve { stroke: #2e7d32; stroke-width: 2; fill: none; }
      .axis { stroke: #444; stroke-width: 1; fill: none; }
      .thresh { stroke: #aaa; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
      .arrow { stroke: #1a1a1a; stroke-width: 1.5; fill: none; marker-end: url(#head); }
    </style>
    <marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">Compute bottleneck: AI labour shrinks four stages, experiments do not</text>

  <!-- Panel 1: one research cycle before and after automation -->
  <rect x="40" y="46" width="410" height="256" class="box"/>
  <text x="245" y="66" text-anchor="middle" class="label">one research cycle (time runs left to right)</text>

  <text x="56" y="100" class="small">k = 1 (humans)</text>
  <rect x="70" y="106" width="54" height="22" class="cold"/>
  <rect x="124" y="106" width="90" height="22" class="cold"/>
  <rect x="214" y="106" width="144" height="22" class="hot"/>
  <rect x="358" y="106" width="54" height="22" class="cold"/>
  <rect x="412" y="106" width="18" height="22" class="cold"/>
  <text x="97" y="121" text-anchor="middle" class="small">idea</text>
  <text x="169" y="121" text-anchor="middle" class="small">coding</text>
  <text x="286" y="121" text-anchor="middle" class="small">experiment compute 0.40</text>
  <text x="385" y="121" text-anchor="middle" class="small">eval</text>
  <text x="436" y="140" text-anchor="end" class="small">cycle = 1.00</text>

  <text x="56" y="172" class="small">k = 30, compute fixed</text>
  <rect x="70" y="178" width="4" height="22" class="cold"/>
  <rect x="74" y="178" width="144" height="22" class="hot"/>
  <rect x="218" y="178" width="3" height="22" class="cold"/>
  <text x="146" y="193" text-anchor="middle" class="small">experiment compute 0.40</text>
  <text x="232" y="193" class="content">cycle = 0.42 -&gt; 2.38x</text>

  <text x="56" y="244" class="small">k = 30, compute x4</text>
  <rect x="70" y="250" width="4" height="22" class="cold"/>
  <rect x="74" y="250" width="36" height="22" class="hot"/>
  <rect x="110" y="250" width="3" height="22" class="cold"/>
  <text x="124" y="265" class="content">cycle = 0.12 -&gt; 8.33x</text>
  <text x="245" y="292" text-anchor="middle" class="small">speedup = 1/(f_labour/k + f_compute/g); the hot block ignores k</text>

  <!-- Panel 2: speedup curve vs k -->
  <rect x="470" y="46" width="370" height="256" class="box"/>
  <text x="655" y="66" text-anchor="middle" class="label">total speedup vs labour automation k</text>
  <line x1="500" y1="80" x2="500" y2="258" class="axis"/>
  <line x1="500" y1="258" x2="810" y2="258" class="axis"/>
  <text x="496" y="262" text-anchor="end" class="small">1x</text>
  <text x="496" y="229" text-anchor="end" class="small">2.5x</text>
  <text x="496" y="146" text-anchor="end" class="small">6.25x</text>
  <text x="496" y="64" text-anchor="end" class="small">10x</text>
  <text x="500" y="274" text-anchor="middle" class="small">1</text>
  <text x="600" y="274" text-anchor="middle" class="small">10</text>
  <text x="700" y="274" text-anchor="middle" class="small">100</text>
  <text x="800" y="274" text-anchor="middle" class="small">1000</text>
  <text x="655" y="290" text-anchor="middle" class="small">k (log scale)</text>
  <line x1="500" y1="225" x2="810" y2="225" class="thresh"/>
  <line x1="500" y1="60" x2="810" y2="60" class="thresh"/>
  <polyline class="sw-curve" points="500,258 530,248.5 570,237.8 600,232.3 648,227.6 700,225.9 800,225"/>
  <polyline class="both-curve" points="500,248.5 530,225 570,179.9 600,142.5 648,96.7 700,72.5 800,61.3"/>
  <text x="712" y="214" class="small">software-only: ceiling 1/f_c = 2.5x</text>
  <text x="712" y="88" class="small">compute x4: ceiling g/f_c = 10x</text>
  <text x="640" y="120" class="small">k = 30 is already 95% of the 2.5x ceiling</text>

  <!-- Panel 3: the queue -->
  <rect x="40" y="318" width="800" height="126" class="box"/>
  <text x="440" y="338" text-anchor="middle" class="label">N agent copies, one shared GPU pool: the pool, not the copies, sets throughput</text>
  <rect x="60" y="352" width="150" height="70" class="cold"/>
  <text x="135" y="374" text-anchor="middle" class="content">N agents at 30x</text>
  <text x="135" y="390" text-anchor="middle" class="small">think 0.02 cycles,</text>
  <text x="135" y="404" text-anchor="middle" class="small">then submit 1 experiment</text>
  <line x1="212" y1="387" x2="262" y2="387" class="arrow"/>
  <rect x="266" y="352" width="120" height="70" class="box"/>
  <text x="326" y="374" text-anchor="middle" class="content">FIFO queue</text>
  <text x="326" y="390" text-anchor="middle" class="small">wait grows linearly</text>
  <text x="326" y="404" text-anchor="middle" class="small">once N &gt; knee</text>
  <line x1="388" y1="387" x2="438" y2="387" class="arrow"/>
  <rect x="442" y="352" width="150" height="70" class="hot"/>
  <text x="517" y="374" text-anchor="middle" class="content">GPU pool, C = 8</text>
  <text x="517" y="390" text-anchor="middle" class="small">each experiment 0.40 cycles</text>
  <text x="517" y="404" text-anchor="middle" class="small">ceiling C/E = 20 per cycle</text>
  <line x1="594" y1="387" x2="644" y2="387" class="arrow"/>
  <rect x="648" y="352" width="176" height="70" class="cool"/>
  <text x="736" y="374" text-anchor="middle" class="small">8 agents: 19.0/cycle, wait 0</text>
  <text x="736" y="390" text-anchor="middle" class="small">128 agents: 19.8/cycle, wait 5.6</text>
  <text x="736" y="406" text-anchor="middle" class="small">per-copy cycle 0.42 -&gt; 6.40 (15x)</text>

  <text x="440" y="474" text-anchor="middle" class="caption">Effective compute = physical compute x software efficiency; a software-only explosion moves one factor, and experiment latency caps it at g / f_compute.</text>
  <text x="440" y="496" text-anchor="middle" class="small">Compute is the countable factor: chips, power and training runs are observable; algorithmic gains are not (Lesson 21).</text>
</svg>
