<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .walk { stroke: #c0392b; stroke-width: 1.8; fill: none; }
      .gated { stroke: #2e7d32; stroke-width: 1.8; fill: none; }
      .cone { stroke: #2c5ea9; stroke-width: 1.2; stroke-dasharray: 5 3; fill: #dfe9ff; fill-opacity: 0.35; }
      .arrow { stroke: #1a1a1a; stroke-width: 1.2; fill: none; }
      .nowrite { stroke: #c0392b; stroke-width: 1.6; fill: none; stroke-dasharray: 3 3; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">Alignment anchors — does the objective survive n self-edits?</text>

  <!-- Panel 1: drift in objective space -->
  <rect x="30" y="46" width="300" height="400" class="box"/>
  <text x="180" y="68" text-anchor="middle" class="label">1 · objective space, 200 edits</text>
  <polygon points="100,392 300,112 300,230" class="cone"/>
  <line x1="100" y1="392" x2="310" y2="222" class="arrow"/>
  <text x="256" y="240" class="small">anchor a</text>
  <text x="214" y="118" class="small">allowed cone</text>
  <text x="214" y="131" class="small">cos ≥ 0.90 (25.8°)</text>
  <polyline class="walk" points="100,392 112,372 122,380 134,356 128,338 146,322 154,300 148,280 166,262 176,240 170,220 190,206 206,188 216,170 234,160 248,140 262,128"/>
  <text x="150" y="258" class="small" fill="#c0392b">ungated √n walk</text>
  <text x="150" y="271" class="small" fill="#c0392b">cos 0.809 · 36°</text>
  <polyline class="gated" points="100,392 118,374 130,360 148,346 160,334 176,322 190,310 206,302 222,290 238,282 252,270 268,262 284,250 298,240"/>
  <text x="196" y="334" class="small" fill="#2e7d32">hard gate: rides the wall</text>
  <text x="196" y="347" class="small" fill="#2e7d32">cos ≥ 0.900 · 25.1% rejected</text>
  <line x1="238" y1="282" x2="226" y2="262" class="nowrite"/>
  <line x1="268" y1="262" x2="258" y2="240" class="nowrite"/>
  <text x="200" y="258" class="small" fill="#c0392b">✕ rejected</text>
  <rect x="44" y="404" width="272" height="34" class="hot"/>
  <text x="180" y="418" text-anchor="middle" class="content">soft penalty: 0 rejected, ends 0.881</text>
  <text x="180" y="432" text-anchor="middle" class="content">a penalty slows drift, it does not bound it</text>

  <!-- Panel 2: the write graph -->
  <rect x="350" y="46" width="260" height="400" class="box"/>
  <text x="480" y="68" text-anchor="middle" class="label">2 · who may write to what</text>
  <rect x="368" y="84" width="224" height="58" class="hot"/>
  <text x="480" y="102" text-anchor="middle" class="content">self-improvement loop</text>
  <text x="480" y="117" text-anchor="middle" class="small">edits weights · scaffold · data</text>
  <text x="480" y="131" text-anchor="middle" class="small">proposes; never accepts</text>
  <rect x="368" y="178" width="224" height="46" class="cold"/>
  <text x="480" y="196" text-anchor="middle" class="content">constitution (read-only, hashed)</text>
  <text x="480" y="211" text-anchor="middle" class="small">+ held-out anchor set, never for selection</text>
  <rect x="368" y="260" width="224" height="46" class="cool"/>
  <text x="480" y="278" text-anchor="middle" class="content">external evaluator · hard gates</text>
  <text x="480" y="293" text-anchor="middle" class="small">reject, do not penalize · may pause loop</text>
  <rect x="368" y="342" width="224" height="46" class="box"/>
  <text x="480" y="360" text-anchor="middle" class="content">human diff review</text>
  <text x="480" y="375" text-anchor="middle" class="small">reward model · judge prompts · thresholds</text>
  <line x1="480" y1="142" x2="480" y2="176" class="arrow" marker-end="url(#ah)"/>
  <text x="488" y="162" class="small">reads</text>
  <line x1="420" y1="224" x2="420" y2="258" class="arrow" marker-end="url(#ah)"/>
  <line x1="540" y1="258" x2="540" y2="144" class="arrow" marker-end="url(#ah)"/>
  <text x="548" y="236" class="small">accept /</text>
  <text x="548" y="249" class="small">reject</text>
  <line x1="480" y1="306" x2="480" y2="340" class="arrow" marker-end="url(#ah)"/>
  <text x="488" y="326" class="small">objective-bearing diffs</text>
  <path d="M 380 142 C 356 200, 356 230, 376 262" class="nowrite"/>
  <text x="372" y="246" class="small" fill="#c0392b">✕ no write path</text>
  <rect x="368" y="404" width="224" height="34" class="hot"/>
  <text x="480" y="418" text-anchor="middle" class="content">rejection rate is a sensor:</text>
  <text x="480" y="432" text-anchor="middle" class="content">25.1% → 48.9% under bias 0.005</text>

  <!-- Panel 3: necessary, not sufficient -->
  <rect x="630" y="46" width="220" height="400" class="box"/>
  <text x="740" y="68" text-anchor="middle" class="label">3 · probe resolution</text>
  <text x="648" y="92" class="small">K items   passes a state 0.05 outside</text>
  <rect x="648" y="100" width="184" height="18" class="hot"/>
  <text x="656" y="113" class="content">K = 4        41.2%</text>
  <rect x="648" y="122" width="184" height="18" class="hot"/>
  <text x="656" y="135" class="content">K = 16       25.5%</text>
  <rect x="648" y="144" width="184" height="18" class="cool"/>
  <text x="656" y="157" class="content">K = 64        3.5%</text>
  <rect x="648" y="166" width="184" height="18" class="cool"/>
  <text x="656" y="179" class="content">K = 256       0.2%</text>
  <text x="740" y="202" text-anchor="middle" class="small">resolution grows with √K</text>
  <rect x="648" y="218" width="184" height="70" class="cold"/>
  <text x="740" y="236" text-anchor="middle" class="content">probe-only gate, bias 0.005</text>
  <text x="740" y="252" text-anchor="middle" class="small">K=4: 57.4% of states outside</text>
  <text x="740" y="266" text-anchor="middle" class="small">worst cosine 0.615</text>
  <text x="740" y="280" text-anchor="middle" class="small">oracle hard gate: never &lt; 0.900</text>
  <rect x="648" y="304" width="184" height="134" class="box"/>
  <text x="740" y="322" text-anchor="middle" class="content">what no K fixes</text>
  <text x="656" y="342" class="small">- mesa-objective that produces</text>
  <text x="656" y="355" class="small">  exactly the probed behaviour</text>
  <text x="656" y="372" class="small">- conditional goal, trigger absent</text>
  <text x="656" y="389" class="small">- loop that edits the judge</text>
  <text x="656" y="409" class="small">→ add control (L19), sandbagging</text>
  <text x="656" y="422" class="small">  screens (L20), interp probes</text>

  <text x="440" y="470" text-anchor="middle" class="caption">Omohundro 2008: a goal-directed system protects its objective — good or bad. Value drift: each imperfect edit moves it ∝ √n.</text>
  <text x="440" y="492" text-anchor="middle" class="small">Löb / Tiling Agents (2013): a system cannot prove its successor trustworthy with its own axioms — verification must come from outside the loop.</text>
</svg>
