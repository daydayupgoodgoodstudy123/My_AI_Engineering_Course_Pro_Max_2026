<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .arrow { stroke: #1a1a1a; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
      .clean-curve { stroke: #2e7d32; stroke-width: 2; fill: none; }
      .noisy-curve { stroke: #c0392b; stroke-width: 2; fill: none; stroke-dasharray: 5 3; }
      .axis { stroke: #444; stroke-width: 1; fill: none; }
      .thresh { stroke: #aaa; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">Self-play — the loop closes only when the verifier is exact</text>

  <!-- Left panel: the closed loop -->
  <rect x="40" y="50" width="400" height="410" class="box"/>
  <text x="240" y="72" text-anchor="middle" class="label">one generation of the loop (code/main.py)</text>

  <rect x="60" y="95" width="150" height="52" class="cold"/>
  <text x="135" y="116" text-anchor="middle" class="content">policy pi_g</text>
  <text x="135" y="132" text-anchor="middle" class="content">(tabular Q, eps-greedy)</text>

  <rect x="270" y="95" width="150" height="52" class="box"/>
  <text x="345" y="116" text-anchor="middle" class="content">self-generated games</text>
  <text x="345" y="132" text-anchor="middle" class="content">vs pi_g and frozen pi_g-1</text>

  <rect x="270" y="215" width="150" height="66" class="cool"/>
  <text x="345" y="236" text-anchor="middle" class="content">verifier</text>
  <text x="345" y="252" text-anchor="middle" class="content">rules: +1 / 0 / -1</text>
  <text x="345" y="268" text-anchor="middle" class="content">minimax: move quality</text>

  <rect x="60" y="215" width="150" height="66" class="cold"/>
  <text x="135" y="236" text-anchor="middle" class="content">Q update</text>
  <text x="135" y="252" text-anchor="middle" class="content">Q += a (target - Q)</text>
  <text x="135" y="268" text-anchor="middle" class="content">snapshot -> pi_g+1</text>

  <path class="arrow" d="M210,121 L268,121"/>
  <path class="arrow" d="M345,147 L345,213"/>
  <path class="arrow" d="M270,248 L212,248"/>
  <path class="arrow" d="M135,215 L135,149"/>
  <text x="239" y="113" text-anchor="middle" class="small">plays</text>
  <text x="352" y="185" class="small">outcome</text>
  <text x="239" y="242" text-anchor="middle" class="small">target</text>
  <text x="104" y="185" class="small">next gen</text>

  <rect x="60" y="305" width="360" height="140" class="box"/>
  <text x="240" y="325" text-anchor="middle" class="label">three closure conditions</text>
  <text x="72" y="347" class="small">1  verifier cannot be gamed      rules decide; policy cannot edit them</text>
  <text x="72" y="367" class="small">2  endless tasks at the frontier  opponent = current self (auto-curriculum)</text>
  <text x="72" y="387" class="small">3  no train/target shift          the game trained on IS the game evaluated</text>
  <text x="72" y="412" class="small">break 1 (flip 20% of results) and the same loop plateaus;</text>
  <text x="72" y="428" class="small">population of past generations lowers the exploit column.</text>

  <!-- Right top: clean vs corrupted verifier -->
  <rect x="460" y="50" width="380" height="230" class="box"/>
  <text x="650" y="72" text-anchor="middle" class="label">non-loss vs minimax, seed 11, 5,000 games/gen</text>
  <line x1="500" y1="90" x2="500" y2="240" class="axis"/>
  <line x1="500" y1="240" x2="820" y2="240" class="axis"/>
  <text x="470" y="94" class="small">100%</text>
  <text x="478" y="166" class="small">50%</text>
  <text x="484" y="243" class="small">0%</text>
  <text x="497" y="256" class="small">0</text>
  <text x="634" y="256" class="small">3</text>
  <text x="816" y="256" class="small">7</text>
  <text x="660" y="270" text-anchor="middle" class="small">generation</text>
  <line x1="500" y1="97" x2="820" y2="97" class="thresh"/>
  <text x="702" y="94" class="small">95% = ceiling in sight</text>
  <polyline class="clean-curve" points="500,214.5 546,127.5 591,112.5 637,104.3 683,95.3 729,94.5 774,97.5 820,92.3"/>
  <polyline class="noisy-curve" points="500,174 546,174.8 591,175.5 637,170.3 683,152.3 729,135.8 774,132 820,128.3"/>
  <text x="590" y="150" class="small" fill="#2e7d32">clean verifier: 17% -> 98.5%</text>
  <text x="640" y="200" class="small" fill="#c0392b">20% flipped: 44% -> 74.5%</text>

  <!-- Right bottom: where the recipe went -->
  <rect x="460" y="295" width="380" height="165" class="box"/>
  <text x="650" y="315" text-anchor="middle" class="label">where the recipe transferred</text>
  <rect x="475" y="328" width="350" height="36" class="cool"/>
  <text x="485" y="343" class="small">AlphaZero (Science 2018): Go, chess, shogi. Verifier = rules.</text>
  <text x="485" y="357" class="small">Conditions 1-3 all hold. Loop fully closed.</text>
  <rect x="475" y="372" width="350" height="36" class="cool"/>
  <text x="485" y="387" class="small">AlphaProof (Jul 2024; Nature Nov 2025): verifier = Lean.</text>
  <text x="485" y="401" class="small">IMO 2024: 28/42 with AlphaGeometry 2, gold began at 29.</text>
  <rect x="475" y="416" width="350" height="36" class="hot"/>
  <text x="485" y="431" class="small">Research, writing, taste: no exact verifier (cond. 1 fails).</text>
  <text x="485" y="445" class="small">Judges and rubrics can be gamed -> Lessons 06, 14.</text>

  <text x="440" y="486" text-anchor="middle" class="caption">A perfect verifier turns self-generated games into progress toward the minimax ceiling; corrupt it and the loop learns the verifier's mistakes.</text>
  <text x="440" y="506" text-anchor="middle" class="small">Silver et al. 2018; Hubert et al. 2025; Balduzzi et al. ICML 2019 (intransitive cycles, population training).</text>
</svg>
