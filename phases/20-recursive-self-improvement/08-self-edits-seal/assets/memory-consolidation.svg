<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .arrow { stroke: #444; stroke-width: 1.5; fill: none; marker-end: url(#head); }
      .back { stroke: #c0392b; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; marker-end: url(#headred); }
      .axis { stroke: #444; stroke-width: 1; fill: none; }
      .forget { stroke: #c0392b; stroke-width: 2; fill: none; }
      .keep { stroke: #2e7d32; stroke-width: 2; fill: none; }
      .thresh { stroke: #aaa; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
    </style>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#444"/>
    </marker>
    <marker id="headred" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">SEAL — a consolidation loop whose policy is learned, and what its reward never asks</text>

  <!-- Panel 1: inner loop -->
  <rect x="30" y="48" width="270" height="400" class="box"/>
  <text x="165" y="70" text-anchor="middle" class="label">inner loop: the weights change</text>

  <rect x="60" y="88" width="210" height="44" class="box"/>
  <text x="165" y="107" text-anchor="middle" class="content">context: passage or demos</text>
  <text x="165" y="123" text-anchor="middle" class="small">labels stay outside</text>

  <line x1="165" y1="132" x2="165" y2="150" class="arrow"/>
  <rect x="60" y="152" width="210" height="70" class="cold"/>
  <text x="165" y="171" text-anchor="middle" class="content">model writes a self-edit</text>
  <text x="70" y="189" class="small">- implications of the passage</text>
  <text x="70" y="203" class="small">- augmentation flags</text>
  <text x="70" y="217" class="small">- lr, epochs, loss mask</text>

  <line x1="165" y1="222" x2="165" y2="240" class="arrow"/>
  <rect x="60" y="242" width="210" height="44" class="hot"/>
  <text x="165" y="261" text-anchor="middle" class="content">SFT / LoRA on the self-edit</text>
  <text x="165" y="277" text-anchor="middle" class="small">θ → θ'  (persistent)</text>

  <line x1="165" y1="286" x2="165" y2="304" class="arrow"/>
  <rect x="60" y="306" width="210" height="44" class="cool"/>
  <text x="165" y="325" text-anchor="middle" class="content">score θ' on held-out questions</text>
  <text x="165" y="341" text-anchor="middle" class="small">new task only</text>

  <text x="165" y="378" text-anchor="middle" class="small">one finetune per sampled self-edit</text>
  <text x="165" y="394" text-anchor="middle" class="small">SEAL: 30-45 s each, LoRA, 1B-7B</text>
  <text x="165" y="422" text-anchor="middle" class="small">ARC subset: 0% ICL / 20% untrained</text>
  <text x="165" y="436" text-anchor="middle" class="small">self-edits / 72.5% trained policy</text>

  <!-- Panel 2: outer loop -->
  <rect x="318" y="48" width="250" height="400" class="box"/>
  <text x="443" y="70" text-anchor="middle" class="label">outer loop: the policy changes</text>

  <rect x="338" y="88" width="210" height="44" class="box"/>
  <text x="443" y="107" text-anchor="middle" class="content">sample E self-edits per context</text>
  <text x="443" y="123" text-anchor="middle" class="small">SEAL: 5 per passage, 15 per ARC task</text>

  <line x1="443" y1="132" x2="443" y2="150" class="arrow"/>
  <rect x="338" y="152" width="210" height="44" class="cool"/>
  <text x="443" y="171" text-anchor="middle" class="content">binary reward: did θ' improve?</text>
  <text x="443" y="187" text-anchor="middle" class="small">computed on labelled questions</text>

  <line x1="443" y1="196" x2="443" y2="214" class="arrow"/>
  <rect x="338" y="216" width="210" height="44" class="box"/>
  <text x="443" y="235" text-anchor="middle" class="content">keep the positives (ReST-EM)</text>
  <text x="443" y="251" text-anchor="middle" class="small">trial weights discarded</text>

  <line x1="443" y1="260" x2="443" y2="278" class="arrow"/>
  <rect x="338" y="280" width="210" height="44" class="cold"/>
  <text x="443" y="299" text-anchor="middle" class="content">fine-tune the self-edit policy</text>
  <text x="443" y="315" text-anchor="middle" class="small">2 rounds x 50 passages</text>

  <path d="M338,302 C300,302 300,174 320,174 L330,174" class="back"/>
  <text x="300" y="440" class="small"></text>

  <rect x="338" y="346" width="210" height="88" class="hot"/>
  <text x="443" y="366" text-anchor="middle" class="content">not in the reward:</text>
  <text x="348" y="384" class="small">- accuracy on earlier passages</text>
  <text x="348" y="398" class="small">- behavioural / alignment anchors</text>
  <text x="348" y="412" class="small">- what the self-written data says</text>
  <text x="348" y="426" class="small">- who could influence the questions</text>

  <!-- Panel 3: forgetting curve -->
  <rect x="586" y="48" width="264" height="400" class="box"/>
  <text x="718" y="70" text-anchor="middle" class="label">earlier tasks vs committed edits</text>

  <line x1="620" y1="100" x2="620" y2="330" class="axis"/>
  <line x1="620" y1="330" x2="830" y2="330" class="axis"/>
  <text x="596" y="104" class="small">90%</text>
  <text x="596" y="174" class="small">75%</text>
  <text x="596" y="244" class="small">60%</text>
  <text x="596" y="334" class="small">45%</text>
  <text x="620" y="348" class="small">0</text>
  <text x="690" y="348" class="small">2</text>
  <text x="760" y="348" class="small">4</text>
  <text x="826" y="348" class="small">6</text>
  <text x="725" y="364" text-anchor="middle" class="small">self-edits committed in sequence</text>

  <line x1="620" y1="200" x2="830" y2="200" class="thresh"/>
  <text x="700" y="195" class="small">anchor threshold (pre-registered)</text>

  <polyline class="forget" points="620,108 655,120 690,140 725,168 760,196 795,222 830,250"/>
  <text x="704" y="282" class="small">reward = new task only</text>
  <text x="704" y="296" class="small">(toy: +12 pts forgetting)</text>

  <polyline class="keep" points="620,108 655,112 690,118 725,120 760,126 795,128 830,134"/>
  <text x="704" y="150" class="small">replay or anchored reward</text>
  <text x="704" y="164" class="small">(toy: +3 pts)</text>

  <text x="718" y="392" text-anchor="middle" class="small">SEAL paper: earlier-passage accuracy</text>
  <text x="718" y="406" text-anchor="middle" class="small">"gradually declines" with each edit;</text>
  <text x="718" y="420" text-anchor="middle" class="small">no collapse, no protection either</text>

  <text x="440" y="476" text-anchor="middle" class="caption">Weights change persistently (unlike STOP / ADAS), but the signal that trains the policy is still labelled external questions about the new task.</text>
  <text x="440" y="498" text-anchor="middle" class="small">Place on the Lesson 01 ladders: L3 programmatic self-improvement; closed within the RL run, grounded outside it.</text>
</svg>
